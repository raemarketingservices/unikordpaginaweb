services:
  uniko-web:
    build:
      context: .
      args:
        # Vite los inyecta en el bundle: la URL pública tiene que existir ya.
        VITE_DATA_SOURCE: supabase
        VITE_SUPABASE_URL: https://uniko-rd.com
        VITE_SUPABASE_PUBLISHABLE_KEY: ${UNIKO_SUPABASE_ANON_KEY}
        # El botón de Google sólo se pinta si GoTrue tiene el proveedor configurado.
        VITE_GOOGLE_OAUTH: ${UNIKO_GOOGLE_OAUTH:-false}
    container_name: uniko-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:3000"
    networks:
      - uniko

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: uniko-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --config /etc/cloudflared/config.yml homelab-uniko
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - uniko

networks:
  uniko:
    name: uniko
